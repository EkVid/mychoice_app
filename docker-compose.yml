services:
  db:
    image: postgres:16-alpine
    container_name: mychoice_db
    environment:
      POSTGRES_DB: mychoice_app
      POSTGRES_USER: mychoice_user
      POSTGRES_PASSWORD: mychoice_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mychoice_user -d mychoice_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mychoice_backend
    environment:
      POSTGRES_DB: mychoice_app
      POSTGRES_USER: mychoice_user
      POSTGRES_PASSWORD: mychoice_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: mychoice_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
